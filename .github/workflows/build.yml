name: Build and publish

on:
  # Only changes that affect the image publish a new build.
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned versions from Dockerfile
        id: versions
        run: |
          {
            echo "caddy=$(sed -nE 's/^FROM caddy:([0-9.]+)@.*/\1/p' Dockerfile)"
            echo "base_digest=$(sed -nE 's/^FROM caddy:[0-9.]+@(sha256:[0-9a-f]+).*/\1/p' Dockerfile)"
            echo "inwx=$(grep -m1 '^ARG INWX_VERSION=' Dockerfile | cut -d= -f2)"
          } >> "$GITHUB_OUTPUT"

      # Tags mirror the pinned Caddy version (2.11.7 -> 2.11.7, 2.11, 2,
      # latest); the INWX module version is recorded as a label. Title,
      # description, source and revision come from the GitHub repo. licenses
      # would default to the repo's MIT, but the image is mostly Caddy
      # (Apache-2.0); vendor and documentation would be inherited from the
      # official Caddy image.
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # GHCR reads the package description and license of a multi-arch
          # image from the index annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ steps.versions.outputs.caddy }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.versions.outputs.caddy }}
            type=semver,pattern={{major}},value=${{ steps.versions.outputs.caddy }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0 AND MIT
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            org.opencontainers.image.base.name=docker.io/library/caddy:${{ steps.versions.outputs.caddy }}
            org.opencontainers.image.base.digest=${{ steps.versions.outputs.base_digest }}
            de.jonrei.caddy-inwx.inwx-version=${{ steps.versions.outputs.inwx }}
          annotations: |
            org.opencontainers.image.licenses=Apache-2.0 AND MIT

      # No QEMU needed: the builder stage runs natively and cross-compiles,
      # and the final stage has no RUN instructions.
      - uses: docker/setup-buildx-action@v4

      # Build the native-arch image into the local daemon to smoke-test it.
      # The multi-arch build below reuses its layers.
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: caddy-inwx:test
          cache-from: type=gha

      - name: Smoke test
        run: |
          docker run --rm caddy-inwx:test caddy list-modules --versions \
            | grep -E '^dns\.providers\.inwx\s+${{ steps.versions.outputs.inwx }}$'

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
